name: EB Outlook

on:
  schedule:
    # New outlook: first day of each quarter, 00:30 UTC (after the Dec 31 / Mar 31 / Jun 30 / Sep 30 close)
    - cron: "30 0 1 1,4,7,10 *"
    # Weekly refresh of performance: Monday 12:00 UTC (7:00 am New York in winter)
    - cron: "0 12 * * 1"
  # Also runs when the engine or the theme list changes
  push:
    branches: [main]
    paths: ["engine.py", "themes.json", "requirements.txt", ".github/workflows/outlook.yml"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Recompute this quarter's outlook from scratch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eb-outlook
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python engine.py --rebuild
          else
            python engine.py
          fi

      - name: Publish
        run: |
          git config user.name "eb-outlook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "EB Outlook update $(date -u +%F)"
          git push
